[project]
name = "digit-recognizer"
version = "0.0.1"
readme = "README.md"
requires-python = "~=3.10.0"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-stubs~=2.3.3",
    "tensorflow<2.11.0 ; sys_platform == 'win32' and python_version == '3.10'",
    "tensorflow[and-cuda]>=2.21.0 ; sys_platform != 'win32'",
]
