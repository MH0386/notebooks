[project]
  dependencies = [
    "datasets>=5.0.0",
    "huggingface-hub[torch]>=1.21.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.8",
    "peft>=0.19.1",
    "torch>=2.12.1",
    "transformers>=5.12.1",
    "wandb>=0.28.0",
  ]
  name = "phi-2-fine-tuning-as-napoleon-bonaparte"
  readme = "README.md"
  requires-python = ">=3.13,<3.14"
