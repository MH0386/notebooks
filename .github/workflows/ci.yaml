name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 0 * * *
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  check-deps:
    name: Check Dependency Compatibility
    runs-on: ubuntu-latest
    environment: dependency
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Cleaning Jupyter Notebooks
        run: mise run check-deps
  clean_jupyter:
    name: Clean Jupyter Notebooks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: notebooks
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Cleaning Jupyter Notebooks
        run: mise run clean-jupyter
      - name: Commit cleaned Jupyter Notebooks
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "nb-clean: Clean Jupyter Notebooks"
          commit_options: --no-verify
  check_jupyter:
    name: Check Jupyter Notebooks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    environment: notebooks
    needs: clean_jupyter
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Checking Jupyter Notebooks
        run: mise run check-jupyter
  render:
    name: Render
    runs-on: ubuntu-latest
    needs:
      - clean_jupyter
      - check_jupyter
    environment: quarto
    permissions:
      contents: write
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - name: Cache _site
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: _site
          key: ${{ runner.os }}-quarto-${{ hashFiles('**/uv.lock') }}
          restore-keys: ${{ runner.os }}-quarto-
      - name: Build Web
        run: mise run render
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: render
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: quarto
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request' && github.event_name != 'schedule'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
